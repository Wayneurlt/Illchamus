name: Deploy Remotely
on:
  push:
    branches:
      - main

jobs:
  Deploy-Remotely:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js 23.x to Build
        uses: actions/setup-node@v2
        with:
          node-version: "23.11.1"

      - run: npm ci

      - name: Build for GCP
        run: npm run build

      # Site settings come from GitHub secrets (Settings → Secrets and variables → Actions).
      # Values are JSON-encoded so passwords with quotes or symbols are written safely.
      - name: Generate PM2 ecosystem.config.cjs File
        env:
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_ADMIN_PASSWORD: ${{ secrets.NUXT_ADMIN_PASSWORD }}
          NUXT_RESEND_API_KEY: ${{ secrets.NUXT_RESEND_API_KEY }}
          NUXT_RESEND_AUDIENCE_ID: ${{ secrets.NUXT_RESEND_AUDIENCE_ID }}
          NUXT_MAIL_FROM: ${{ secrets.NUXT_MAIL_FROM }}
          NUXT_PUBLIC_SITE_URL: ${{ secrets.NUXT_PUBLIC_SITE_URL }}
        run: |
          mkdir -p .output/server
          node -e '
            const pick = (k) => (process.env[k] ? { [k]: process.env[k] } : {});
            const env = {
              PORT: 3200,
              NITRO_PORT: 3200,
              NODE_ENV: "production",
              // Saved content (news, events, team, messages, uploads) lives outside the build folder.
              NUXT_DATA_DIR: "/home/tiny/temi/data",
              ...pick("NUXT_SESSION_PASSWORD"),
              ...pick("NUXT_ADMIN_PASSWORD"),
              ...pick("NUXT_RESEND_API_KEY"),
              ...pick("NUXT_RESEND_AUDIENCE_ID"),
              ...pick("NUXT_MAIL_FROM"),
              ...pick("NUXT_PUBLIC_SITE_URL"),
            };
            const config = { apps: [{ name: "temi", script: "index.mjs", exec_mode: "cluster", instances: "max", env }] };
            require("fs").writeFileSync(".output/server/ecosystem.config.cjs",
              "const config = " + JSON.stringify(config, null, 2) + ";\nconfig.apps[0].cwd = __dirname;\nmodule.exports = config;\n");
          '

      - name: Setup and Verify SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -lf ~/.ssh/deploy_key || echo "❌ Invalid SSH key!"
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts

      - name: Rsync Build Folder to GCP Instance
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" .output/ ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:/home/tiny/temi/.output

      - name: Check and Install PM2 if Not Installed
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          port: "22"
          script: |
            export NVM_DIR="$HOME/.nvm"
            source $NVM_DIR/nvm.sh
            export PATH=$NVM_DIR/versions/node/v23.11.1/bin:$PATH
            if ! command -v pm2 > /dev/null; then
              echo "PM2 is not installed. Installing PM2..."
              npm install -g pm2
            else
              echo "PM2 is already installed."
            fi

      - name: Restart PM2 Process
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          port: "22"
          script: |
            export NVM_DIR="$HOME/.nvm"
            source $NVM_DIR/nvm.sh
            export PATH=$NVM_DIR/versions/node/v23.11.1/bin:$PATH
            mkdir -p /home/tiny/temi/data
            cd /home/tiny/temi/.output
            # Start from the generated ecosystem file so the environment settings above apply.
            pm2 delete temi >/dev/null 2>&1 || true
            pm2 start server/ecosystem.config.cjs
            pm2 save
